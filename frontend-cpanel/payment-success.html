<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Mygenx Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://files.svgcdn.io/twemoji/robot.svg" type="image/x-icon">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <main class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
    <div class="text-center space-y-2">
      <div class="text-5xl">&#9989;</div>
      <h1 class="text-xl font-bold text-emerald-300" id="title">Confirming your payment...</h1>
      <p id="msg" class="text-slate-400 text-sm"></p>
    </div>
    <a href="index.html" class="block text-center text-sm font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-2.5 rounded-xl">Back to Studio</a>
    <a href="dashboard.html" class="block text-center text-sm text-slate-400 hover:text-slate-200">View dashboard</a>
  </main>
  <script src="session.js"></script>
  <script>
  const BACKEND_BASE_URL = String(window.WIRO_API_BASE_URL || window.__WIRO_API_BASE_URL || 'https://wiro-railway-app-production.up.railway.app').replace(/\/+$/, '');
  const sessionController = window.WiroSession.create({ baseUrl: BACKEND_BASE_URL });
  const $ = id => document.getElementById(id);
  const paymentId = new URLSearchParams(location.search).get('payment');
  async function poll(attempt = 0) {
    try {
      const res = await sessionController.fetch(`${BACKEND_BASE_URL}/payments/${encodeURIComponent(paymentId)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.error || 'Could not verify payment.');
      if (data.status === 'paid') {
        $('title').textContent = 'Payment successful';
        $('msg').textContent = `${data.credits} credits were added to your account (${data.currency} ${data.amount.toFixed(2)}).`;
        return;
      }
      if (data.status === 'failed') { location.replace(`payment-failed.html?payment=${encodeURIComponent(paymentId)}`); return; }
      if (attempt < 10) { setTimeout(() => poll(attempt + 1), 2000); return; }
      $('title').textContent = 'Payment pending';
      $('msg').textContent = 'We have not received confirmation yet. Credits will be added automatically once the payment clears.';
    } catch (e) { $('title').textContent = 'Unable to verify payment'; $('msg').textContent = e.message; }
  }
  if (paymentId) poll(); else { $('title').textContent = 'Missing payment reference'; }
  </script>
</body>
</html>
