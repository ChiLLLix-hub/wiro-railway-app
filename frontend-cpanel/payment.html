<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Credits - Mygenx Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://files.svgcdn.io/twemoji/robot.svg" type="image/x-icon">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center gap-3 p-4">
  <p id="status" class="text-sm text-slate-400">Redirecting to secure payment...</p>
  <p id="error" class="hidden text-sm text-red-400"></p>
  <a id="back" href="index.html?credits=1" class="hidden text-sm text-slate-400 hover:text-slate-200">Back to pricing</a>
  <script src="session.js"></script>
  <script>
  const BACKEND_BASE_URL = String(window.WIRO_API_BASE_URL || window.__WIRO_API_BASE_URL || 'https://wiro-railway-app-production.up.railway.app').replace(/\/+$/, '');
  const sessionController = window.WiroSession.create({ baseUrl: BACKEND_BASE_URL });
  const $ = id => document.getElementById(id);
  const showError = m => { $('status').classList.add('hidden'); $('error').textContent = m; $('error').classList.remove('hidden'); $('back').classList.remove('hidden'); };
  async function checkout(amount, btn) {
    $('error').classList.add('hidden');
    if (!Number.isInteger(amount) || amount < MIN) { showError(`Enter a whole number of at least RM ${MIN}.`); return false; }
    btn.disabled = true;
    try {
      const res = await sessionController.fetch(`${BACKEND_BASE_URL}/payments/checkout`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.error || 'Could not start payment.');
      window.location.href = data.checkoutUrl;
      return true;
    } catch (e) { showError(e.message); btn.disabled = false; return false; }
  }
  const MIN = 10;
  (async () => {
    if (!sessionController.getToken()) { window.location.replace('index.html?credits=1'); return; }
    const preset = new URLSearchParams(window.location.search).get('amount');
    if (preset && /^\d+$/.test(preset)) {
      const dummy = document.createElement('button');
      await checkout(Number(preset), dummy);
      return;
    }
    window.location.replace('index.html?credits=1');
  })();
  </script>
</body>
</html>
